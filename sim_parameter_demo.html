  <section id="scene-rehearsal" class="scene-rehearsal" aria-label="分镜排练" hidden></section>
  <main>
    <section class="pe-heading" aria-labelledby="pe-title">
      <div class="pe-chapter" id="pe-chapter">01 / 估计的起点</div>
      <div><h1 id="pe-title">从求逆公式出发，跑通参数估计…</h1><p id="pe-copy">入口衔接 → 参数估计 → 回填矩阵 → 正式解混与归位</p></div>
      <div class="pe-count"><span id="pe-step-number">01</span><small id="pe-step-total">/ 13</small></div>
    </section>
    <section class="pe-stage" id="pe-stage" aria-label="参数估计动画">
      <div class="pe-stage-meta"><span id="pe-stage-label">PROVISIONAL BANDS → ESTIMATION</span><span>第 1 方向 · 同一份三相位数据</span></div>
      <svg id="pe-svg" viewBox="0 0 1440 560" role="img" aria-labelledby="pe-svg-title pe-svg-description"><title id="pe-svg-title">SIM 参数估计章节</title><desc id="pe-svg-description">先说明矩阵中的未知量，通过临时分离估计参数，再回填同一个矩阵，正式解混和归位。</desc><g id="pe-art"></g></svg>
      <button id="pe-previous" class="pe-edge pe-edge-left" type="button" aria-label="上一步">←</button>
      <button id="pe-next" class="pe-edge pe-edge-right" type="button" aria-label="下一步">→</button>
    </section>
    <section class="pe-formula" aria-label="当前步骤的公式与解释"><span>原理 · 对应当前动作</span><div><div id="pe-equation"></div><p id="pe-note"></p></div></section>
  </main>
  <footer class="pe-footer">
    <div class="pe-transport"><span class="pe-hint">← 返回 <span>/</span> 右侧继续 → <span>·</span> 空格暂停</span><span id="pe-status" role="status" aria-live="polite">准备中</span><div><button id="pe-replay" type="button">↺ 重看这一步</button><button id="pe-restart" type="button">↺ 重来</button><button id="pe-speed" type="button" aria-label="播放速度，当前 1 倍">1×</button><button id="pe-play" type="button">下一步 →</button></div></div>
    <div class="pe-timeline"><div id="pe-timeline-track"><input id="pe-progress" type="range" min="0" max="16" value="0" step="0.001" aria-label="参数估计时间轴"><div id="pe-stops" class="pe-stops" role="group" aria-label="十六个停点"></div></div></div>
  </footer>
</div>
