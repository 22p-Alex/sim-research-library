<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc"><title id="title">固定探测频率，比较三份不同的样品频率</title><desc id="desc">左图 f=(6,0) 产生 q=(6,0),(-2,0),(14,0)，一个在半径10之外；右图 f=(0,8) 产生 q=(0,8),(-8,8),(8,8)，两个在半径10之外。</desc><defs><marker id="plus" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#226bb5"/></marker><marker id="minus" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bd581e"/></marker></defs><rect width="100%" height="100%" fill="#f7f9fb"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><rect x="20" y="20" width="570" height="490" rx="15" fill="white" stroke="#dce4e9"/><text x="42" y="61" font-size="25" fill="#1d3040" text-anchor="start" font-weight="650">A  固定探测点 f = (6, 0)</text><text x="42" y="96" font-size="19" fill="#607383" text-anchor="start" font-weight="400">沿照明方向取点：只有一个分量在宽场圆外。</text><circle cx="280" cy="304" r="140" stroke="#a4b2bd" stroke-width="2" fill="#eaf0f4" fill-opacity="0.7"/><line x1="48" y1="304" x2="562" y2="304" stroke="#b4c1ca" stroke-width="1.3" stroke-dasharray=""/><line x1="280" y1="133" x2="280" y2="454" stroke="#b4c1ca" stroke-width="1.3" stroke-dasharray=""/><text x="556" y="294" font-size="19" fill="#607383" text-anchor="start" font-weight="400">qₓ</text><text x="290" y="141" font-size="19" fill="#607383" text-anchor="start" font-weight="400">qᵧ</text><line x1="140" y1="300" x2="140" y2="308" stroke="#b4c1ca" stroke-width="1.3" stroke-dasharray=""/><text x="140" y="329" font-size="17" fill="#607383" text-anchor="middle" font-weight="400">-10</text><line x1="280" y1="300" x2="280" y2="308" stroke="#b4c1ca" stroke-width="1.3" stroke-dasharray=""/><text x="280" y="329" font-size="17" fill="#607383" text-anchor="middle" font-weight="400">0</text><line x1="420" y1="300" x2="420" y2="308" stroke="#b4c1ca" stroke-width="1.3" stroke-dasharray=""/><text x="420" y="329" font-size="17" fill="#607383" text-anchor="middle" font-weight="400">10</text><path d="M 364 295 Q 308.0 219 252 295" fill="none" stroke="#226bb5" stroke-width="2" marker-end="url(#plus)"/><circle cx="252" cy="304" r="6" fill="#226bb5" stroke="white" stroke-width="2"/><text x="252" y="364" font-size="21" fill="#226bb5" text-anchor="middle" font-weight="600">+1：(-2, 0)</text><path d="M 364 295 Q 420.0 219 476 295" fill="none" stroke="#bd581e" stroke-width="2" marker-end="url(#minus)"/><circle cx="476" cy="304" r="6" fill="#bd581e" stroke="white" stroke-width="2"/><text x="476" y="364" font-size="21" fill="#bd581e" text-anchor="middle" font-weight="600">-1：(14, 0)</text><circle cx="364" cy="304" r="6" fill="#526776" stroke="white" stroke-width="2"/><text x="364" y="398" font-size="21" fill="#526776" text-anchor="middle" font-weight="600">0：(6, 0)</text><text x="305" y="484" font-size="18" fill="#607383" text-anchor="middle" font-weight="400">浅灰圆：宽场支撑 |q| &lt; 10    ·    照明 k = (8, 0)</text><rect x="610" y="20" width="570" height="490" rx="15" fill="white" stroke="#dce4e9"/><text x="632" y="61" font-size="25" fill="#1d3040" text-anchor="start" font-weight="650">B  固定探测点 f = (0, 8)</text><text x="632" y="96" font-size="19" fill="#607383" text-anchor="start" font-weight="400">二维取点：两个边带可以同时在宽场圆外。</text><circle cx="880" cy="304" r="140" stroke="#a4b2bd" stroke-width="2" fill="#eaf0f4" fill-opacity="0.7"/><line x1="638" y1="304" x2="1152" y2="304" stroke="#b4c1ca" stroke-width="1.3" stroke-dasharray=""/><line x1="880" y1="133" x2="880" y2="454" stroke="#b4c1ca" stroke-width="1.3" stroke-dasharray=""/><text x="1146" y="294" font-size="19" fill="#607383" text-anchor="start" font-weight="400">qₓ</text><text x="890" y="141" font-size="19" fill="#607383" text-anchor="start" font-weight="400">qᵧ</text><line x1="740" y1="300" x2="740" y2="308" stroke="#b4c1ca" stroke-width="1.3" stroke-dasharray=""/><text x="740" y="329" font-size="17" fill="#607383" text-anchor="middle" font-weight="400">-10</text><line x1="880" y1="300" x2="880" y2="308" stroke="#b4c1ca" stroke-width="1.3" stroke-dasharray=""/><text x="880" y="329" font-size="17" fill="#607383" text-anchor="middle" font-weight="400">0</text><line x1="1020" y1="300" x2="1020" y2="308" stroke="#b4c1ca" stroke-width="1.3" stroke-dasharray=""/><text x="1020" y="329" font-size="17" fill="#607383" text-anchor="middle" font-weight="400">10</text><path d="M 880 183 Q 824.0 183 768 183" fill="none" stroke="#226bb5" stroke-width="2" marker-end="url(#plus)"/><circle cx="768" cy="192" r="6" fill="#226bb5" stroke="white" stroke-width="2"/><text x="768" y="159" font-size="21" fill="#226bb5" text-anchor="middle" font-weight="600">+1：(-8, 8)</text><path d="M 880 183 Q 936.0 183 992 183" fill="none" stroke="#bd581e" stroke-width="2" marker-end="url(#minus)"/><circle cx="992" cy="192" r="6" fill="#bd581e" stroke="white" stroke-width="2"/><text x="992" y="159" font-size="21" fill="#bd581e" text-anchor="middle" font-weight="600">-1：(8, 8)</text><circle cx="880" cy="192" r="6" fill="#526776" stroke="white" stroke-width="2"/><text x="880" y="234" font-size="21" fill="#526776" text-anchor="middle" font-weight="600">0：(0, 8)</text><text x="895" y="484" font-size="18" fill="#607383" text-anchor="middle" font-weight="400">浅灰圆：宽场支撑 |q| &lt; 10    ·    照明 k = (8, 0)</text></g></svg>
