<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">单方向搬移后，固定目标样品频率的覆盖关系</title><desc id="desc">q=(14,0)只有中心在(8,0)的负一级圆盘覆盖；q=(0,14)无覆盖。正负边带交叠处都在半径6以内。</desc><defs><marker id="plus" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#226bb5"/></marker><marker id="minus" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bd581e"/></marker></defs><rect width="100%" height="100%" fill="#f7f9fb"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><rect x="20" y="20" width="756" height="650" rx="15" fill="white" stroke="#dce4e9"/><rect x="796" y="20" width="384" height="650" rx="15" fill="white" stroke="#dce4e9"/><text x="45" y="61" font-size="25" fill="#1d3040" text-anchor="start" font-weight="650">固定样品频率 q：数一数有几个频带覆盖它</text><text x="45" y="97" font-size="20" fill="#607383" text-anchor="start" font-weight="400">三个半径 10 的圆盘；中心分别为 −k、0、+k。</text><circle cx="395" cy="390" r="170" stroke="#526776" stroke-width="2" fill="#eaf0f4" fill-opacity="0.65"/><circle cx="259" cy="390" r="170" stroke="#226bb5" stroke-width="2" fill="#5a9cdd" fill-opacity="0.08"/><circle cx="531" cy="390" r="170" stroke="#bd581e" stroke-width="2" fill="#e69963" fill-opacity="0.08"/><path d="M 395 288.0 A 170 170 0 0 1 395 492.0 A 170 170 0 0 1 395 288.0" fill="#8d73b5" fill-opacity=".18"/><line x1="58" y1="390" x2="740" y2="390" stroke="#b4c1ca" stroke-width="1.3" stroke-dasharray=""/><line x1="395" y1="127" x2="395" y2="575" stroke="#b4c1ca" stroke-width="1.3" stroke-dasharray=""/><text x="734" y="378" font-size="19" fill="#607383" text-anchor="start" font-weight="400">qₓ</text><text x="381" y="139" font-size="19" fill="#607383" text-anchor="end" font-weight="400">qᵧ</text><line x1="89" y1="385" x2="89" y2="395" stroke="#b4c1ca" stroke-width="1.3" stroke-dasharray=""/><text x="89" y="417" font-size="17" fill="#607383" text-anchor="middle" font-weight="400">-18</text><line x1="259" y1="385" x2="259" y2="395" stroke="#b4c1ca" stroke-width="1.3" stroke-dasharray=""/><text x="259" y="417" font-size="17" fill="#607383" text-anchor="middle" font-weight="400">-8</text><line x1="395" y1="385" x2="395" y2="395" stroke="#b4c1ca" stroke-width="1.3" stroke-dasharray=""/><text x="395" y="417" font-size="17" fill="#607383" text-anchor="middle" font-weight="400">0</text><line x1="531" y1="385" x2="531" y2="395" stroke="#b4c1ca" stroke-width="1.3" stroke-dasharray=""/><text x="531" y="417" font-size="17" fill="#607383" text-anchor="middle" font-weight="400">8</text><line x1="701" y1="385" x2="701" y2="395" stroke="#b4c1ca" stroke-width="1.3" stroke-dasharray=""/><text x="701" y="417" font-size="17" fill="#607383" text-anchor="middle" font-weight="400">18</text><circle cx="633" cy="390" r="6" fill="#bd581e" stroke="white" stroke-width="2"/><text x="633" y="361" font-size="21" fill="#bd581e" text-anchor="middle" font-weight="600">q = (14, 0)</text><circle cx="395" cy="152" r="6" fill="#1d3040" stroke="white" stroke-width="2"/><text x="412" y="159" font-size="20" fill="#1d3040" text-anchor="start" font-weight="400">q = (0, 14)：无覆盖</text><text x="217" y="598" font-size="20" fill="#226bb5" text-anchor="middle" font-weight="600">+1 级：中心 (−8, 0)</text><text x="395" y="637" font-size="20" fill="#526776" text-anchor="middle" font-weight="600">0 级：中心 (0, 0)</text><text x="588" y="598" font-size="20" fill="#bd581e" text-anchor="middle" font-weight="600">−1 级：中心 (8, 0)</text><text x="821" y="67" font-size="24" fill="#1d3040" text-anchor="start" font-weight="650">目标 q = (14, 0)</text><text x="821" y="108" font-size="19" fill="#607383" text-anchor="start" font-weight="400">需要读取的探测位置 f = q + ℓk</text><text x="821" y="155" font-size="20" fill="#526776" text-anchor="start" font-weight="400">0 级    →  f = (14, 0)    不可达</text><text x="821" y="198" font-size="20" fill="#226bb5" text-anchor="start" font-weight="400">+1 级  →  f = (22, 0)    不可达</text><text x="821" y="241" font-size="20" fill="#bd581e" text-anchor="start" font-weight="650">−1 级  →  f = (6, 0)      可达</text><line x1="821" y1="281" x2="1154" y2="281" stroke="#b4c1ca" stroke-width="1.3" stroke-dasharray=""/><text x="821" y="326" font-size="23" fill="#1d3040" text-anchor="start" font-weight="650">两个边带的交叠</text><text x="821" y="369" font-size="20" fill="#1d3040" text-anchor="start" font-weight="400">紫色透镜区完全位于 |q| &lt; 6。</text><text x="821" y="408" font-size="20" fill="#1d3040" text-anchor="start" font-weight="400">所以在 |q| &gt; 10 的超分辨区，</text><text x="821" y="447" font-size="20" fill="#1d3040" text-anchor="start" font-weight="400">同一方向最多只有一个有效边带。</text><line x1="821" y1="484" x2="1154" y2="484" stroke="#b4c1ca" stroke-width="1.3" stroke-dasharray=""/><text x="821" y="533" font-size="20" fill="#1d3040" text-anchor="start" font-weight="600">“最多一个”不等于“必有一个”。</text><text x="821" y="574" font-size="19" fill="#1d3040" text-anchor="start" font-weight="400">例如 q = (0, 14)，三个圆都够不到。</text><text x="821" y="630" font-size="18" fill="#607383" text-anchor="start" font-weight="400">圆周处 H = 0；有效支撑不含圆周。</text></g></svg>
