<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>共同复比例 · 五次变形（独立演示）</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<style>
:root{
  color-scheme:dark;
  --bg:#091115;--panel:#101b21;--ink:#edf0e9;--muted:#8b9b9f;--line:#24343b;
  --orange:#efb879;--cyan:#7ad5cd;--violet:#b7a5eb;
  --ui:"Avenir Next","Segoe UI Variable Text","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
.app{height:100dvh;min-width:1024px;display:grid;grid-template-rows:64px minmax(0,1fr) 104px;
  background:radial-gradient(ellipse at 62% 36%,#13232b45,transparent 62%),var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;padding:0 40px;border-bottom:1px solid var(--line);gap:20px}
.brand{display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:2px}
.brand-symbol{position:relative;width:26px;height:27px}
.brand-symbol i{position:absolute;width:14px;height:14px;border:1px solid var(--cyan);border-radius:50%;left:0;top:1px}
.brand-symbol i:nth-child(2){left:11px;border-color:var(--violet)}
.brand-symbol i:nth-child(3){left:5.5px;top:11px;border-color:var(--orange)}
.brand b{font-size:18px;letter-spacing:1px;font-weight:600}
.brand em{font-style:normal;color:#6b838a}
header .ctx{font-size:11px;letter-spacing:1px;color:var(--muted);margin-left:auto;margin-right:6px}
header .ctx .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--cyan);margin-right:8px;vertical-align:1px}
.tag{font-size:10px;letter-spacing:1.5px;color:#7d949e;border:1px solid #2c4048;border-radius:99px;padding:4px 10px}

main{min-height:0;display:grid;grid-template-rows:minmax(120px,auto) minmax(0,1fr) 178px}
.heading{padding:20px 56px 10px;display:grid;grid-template-columns:120px minmax(0,1fr) 96px;gap:18px;align-items:start}
.heading .idx{padding-top:5px;color:var(--orange);font-size:11px;letter-spacing:2px}
.heading .idx::after{content:"";display:block;width:54px;height:1px;background:#85653f;margin-top:13px}
.heading h1{margin:0 0 8px;font-size:clamp(23px,2.1vw,31px);font-weight:500;letter-spacing:.5px;line-height:1.28}
.heading p{margin:0;font-size:clamp(12px,.95vw,14px);line-height:1.7;color:#a3b3b9;max-width:980px}
.heading .counter{display:flex;align-items:baseline;gap:8px;justify-content:flex-end;font-family:Georgia,serif}
.heading .counter b{font-size:29px;font-weight:400;color:#c5d0ce;line-height:1}
.heading .counter span{font-size:13px;color:#8b9b9f}

.stage{position:relative;min-height:0;margin:0 34px;border-top:1px solid #25353b77;border-bottom:1px solid #25353b77}
.stage svg{width:100%;height:100%;display:block;overflow:hidden}
svg text{font-family:var(--ui)}
.t-small{fill:#9fb1b5;font-size:16px;letter-spacing:.3px}
.t-muted{fill:#718992;font-size:14px;letter-spacing:.4px}
.t-label{fill:#b7c7c9;font-size:17px;letter-spacing:.4px}
.t-title{fill:#e0e7e4;font-size:20px;font-weight:500}
.t-eyebrow{font-size:11px;letter-spacing:2.6px}
.t-num{font-family:"SFMono-Regular",Consolas,monospace;font-variant-numeric:tabular-nums;font-size:15px;fill:#a4bbc2}
.t-big{font-family:Georgia,serif;font-size:30px}
.axis{stroke:#3d5a64;stroke-width:1;opacity:.6}
.guide{stroke:#40565f;stroke-width:1;fill:none}

.equation-rail{display:grid;grid-template-columns:120px minmax(0,1fr) 120px;gap:18px;align-items:center;margin:0 56px;padding:10px 0;min-height:0}
.equation-rail .label{font-size:11px;letter-spacing:1px;color:#8aa2ab;line-height:1.7}
.equation-body{position:relative;min-width:0;max-height:100%;overflow:auto;text-align:center;scrollbar-width:thin}
.equation-body .fx{font-size:clamp(17px,1.6vw,23px);line-height:1.6;color:#e8dfd2}
.equation-body .fx+.fx{margin-top:6px}
.equation-body .note{font-size:11px;color:#7f969f;margin-top:8px;line-height:1.6}
.equation-rail .badge{justify-self:end;font-size:10px;letter-spacing:1px;color:#6f888f;border:1px solid #2c4048;border-radius:99px;padding:4px 9px}

footer{border-top:1px solid var(--line);padding:0 56px}
.transport-top{display:flex;align-items:center;gap:22px;height:44px}
.hint{font-size:11px;color:#a2b2b8}
.hint kbd{font:12px inherit;color:#d1d9d5}
.status{font-size:11px;color:#8aa2ab;letter-spacing:.8px;margin-left:auto}
.tools{display:flex;align-items:center;gap:18px}
.tools button{font:inherit;font-size:12px;color:#a3b6bd;background:none;border:0;padding:6px 0;cursor:pointer}
.tools button:hover{color:var(--orange)}
#play{font-size:13px;color:#b8c7c5;font-weight:500}
#play span{color:var(--orange);margin-left:6px}

.timeline{position:relative;height:52px}
.timeline .track{position:absolute;top:7px;left:0;right:0;height:1px;background:#354850}
.timeline .fill{position:absolute;top:7px;left:0;height:1px;background:var(--orange)}
.timeline input{position:absolute;top:1px;left:0;width:100%;height:13px;margin:0;padding:0;border:0;appearance:none;background:transparent;cursor:pointer;z-index:2}
.timeline input::-webkit-slider-runnable-track{height:1px;background:transparent}
.timeline input::-webkit-slider-thumb{appearance:none;width:8px;height:8px;border:0;border-radius:50%;background:var(--orange);margin-top:-4px}
.timeline input::-moz-range-track{height:1px;background:transparent}
.timeline input::-moz-range-thumb{width:8px;height:8px;border:0;border-radius:50%;background:var(--orange)}
.stops{position:absolute;top:19px;left:0;right:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.stops button{position:relative;display:flex;align-items:center;justify-content:center;gap:7px;padding:4px 0;background:none;border:0;font:inherit;font-size:11px;color:#7f97a1;cursor:pointer;letter-spacing:.2px}
.stops button::before{content:"";width:3px;height:3px;border-radius:50%;background:#516a74}
.stops button[aria-current=true]{color:#e1c29d}
.stops button[aria-current=true]::before{background:var(--orange)}
.stops button:hover{color:#e8c59b}
.stops .n{font-family:Georgia,serif;opacity:.78}

@media (max-height:820px){
  .app{grid-template-rows:56px minmax(0,1fr) 94px}
  main{grid-template-rows:minmax(104px,auto) minmax(0,1fr) 164px}
  .heading{padding-top:14px}
  .heading h1{font-size:26px}
  .equation-body .fx{font-size:19px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="brand-symbol" aria-hidden="true"><i></i><i></i><i></i></span>
      <b>SIM</b><span>／</span><span style="color:#8aa2ab">ALPHA STUDY</span>
    </div>
    <div class="ctx"><span class="dot"></span>共同复比例的五次变形</div>
    <span class="tag">独立演示 · 合成数据</span>
  </header>

  <main>
    <section class="heading">
      <div class="idx" id="chapter">05 / 一个待求量</div>
      <div>
        <h1 id="title">两处记录，差的是同一个数。</h1>
        <p id="copy">同一份样品信息被记在 q 与 q+k̂ 两个地址。先把这件事固定下来：两路之间的差别，是一个不随位置变化的复数。</p>
      </div>
      <div class="counter"><b id="num">01</b><span>/ 05</span></div>
    </section>

    <div class="stage">
      <svg id="stage" viewBox="0 0 1440 560" role="img" aria-label="共同复比例的五幕讲解演示">
        <defs>
          <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r=".7" fill="#76878b" opacity=".14"/>
          </pattern>
          <radialGradient id="glow"><stop stop-color="#16323a" stop-opacity=".38"/><stop offset="1" stop-color="#091115" stop-opacity="0"/></radialGradient>
        </defs>
        <rect x="-700" y="-500" width="2840" height="1560" fill="url(#grid)"/>
        <ellipse cx="820" cy="250" rx="700" ry="330" fill="url(#glow)"/>
        <g id="s25"></g>
        <g id="s26"></g>
        <g id="s27"></g>
        <g id="s28"></g>
        <g id="s29"></g>
      </svg>
    </div>

    <section class="equation-rail">
      <span class="label" id="domain">频域 → 空域</span>
      <div class="equation-body" id="equation"></div>
      <span class="badge" id="stage-tag">幕 25 / 05</span>
    </section>
  </main>

  <footer>
    <div class="transport-top">
      <span class="hint"><kbd>←</kbd> 上一步　<kbd>→</kbd> 下一步　<kbd>空格</kbd> 播放</span>
      <span class="status" id="status">停在第 1 幕</span>
      <div class="tools">
        <button id="restart" type="button">↺ 重来</button>
        <button id="prev" type="button">← 上一步</button>
        <button id="play" type="button">▶ 播放<span>→</span></button>
        <button id="next" type="button">下一步 →</button>
      </div>
    </div>
    <div class="timeline">
      <div class="track"></div>
      <div class="fill" id="fill"></div>
      <input id="progress" type="range" min="0" max="4" step="0.001" value="0" aria-label="五幕进度">
      <div class="stops" id="stops"></div>
    </div>
  </footer>
</div>

<script src="vendor/katex/katex.min.js"></script>
<script>
(function(){
'use strict';
const NS='http://www.w3.org/2000/svg', TAU=Math.PI*2;
const $=id=>document.getElementById(id);
const ramp=(v,a,b)=>Math.max(0,Math.min(1,(v-a)/(b-a)));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

/* ---------------- synthetic data: v = alpha * u exactly ---------------- */
const N=64;
let seed=20261019;
const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};
const uRe=new Float64Array(N*N), uIm=new Float64Array(N*N);
const comps=[];
for(let c=0;c<7;c++)comps.push({kx:Math.round((rnd()*2-1)*9),ky:Math.round((rnd()*2-1)*9),a:.30+rnd()*.85,p:rnd()*TAU});
for(let y=0;y<N;y++)for(let x=0;x<N;x++){
  let re=0,im=0;
  for(const c of comps){const t=TAU*(c.kx*x+c.ky*y)/N+c.p;re+=c.a*Math.cos(t);im+=c.a*Math.sin(t);}
  const dx=(x-29)/23, dy=(y-35)/21, env=.22+.78*Math.exp(-(dx*dx+dy*dy));
  uRe[y*N+x]=re*env; uIm[y*N+x]=im*env;
}
let umax=0;
for(let i=0;i<N*N;i++)umax=Math.max(umax,Math.hypot(uRe[i],uIm[i]));
for(let i=0;i<N*N;i++){uRe[i]/=umax;uIm[i]/=umax;}

const M0=0.62, PHD=0.42;
const AL={re:M0*Math.cos(PHD),im:M0*Math.sin(PHD)};
const vRe=new Float64Array(N*N),vIm=new Float64Array(N*N),
      zRe=new Float64Array(N*N),zIm=new Float64Array(N*N),en=new Float64Array(N*N);
for(let i=0;i<N*N;i++){
  vRe[i]=AL.re*uRe[i]-AL.im*uIm[i];
  vIm[i]=AL.re*uIm[i]+AL.im*uRe[i];
  zRe[i]=uRe[i]*vRe[i]+uIm[i]*vIm[i];
  zIm[i]=uRe[i]*vIm[i]-uIm[i]*vRe[i];
  en[i]=uRe[i]*uRe[i]+uIm[i]*uIm[i];
}
let zmax=0,emax=0,Cre=0,Cim=0,Ru=0;
for(let i=0;i<N*N;i++){zmax=Math.max(zmax,Math.hypot(zRe[i],zIm[i]));emax=Math.max(emax,en[i]);Cre+=zRe[i];Cim+=zIm[i];Ru+=en[i];}
const C={re:Cre,im:Cim}, Ahat={re:Cre/Ru,im:Cim/Ru};
const MA=Math.hypot(Ahat.re,Ahat.im), PA=Math.atan2(Ahat.im,Ahat.re);
const CC=Math.hypot(C.re,C.im);

/* display colors: brightness = log modulus, hue = argument */
function hsv(h,s,v){
  h=((h%1)+1)%1;
  const i=Math.floor(h*6),f=h*6-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);
  const m=[[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][i%6];
  return [Math.round(m[0]*255),Math.round(m[1]*255),Math.round(m[2]*255)];
}
function fieldColor(re,im,scale,phase){
  const mag=Math.hypot(re,im)/scale;
  const L=Math.min(1,Math.log1p(1000*Math.max(0,mag))/Math.log1p(1000));
  if(!phase)return hsv(.55,.05,.04+.9*L);
  return hsv(Math.atan2(im,re)/TAU,.70,.05+.92*L);
}
function raster(fn){
  const c=document.createElement('canvas');c.width=N;c.height=N;
  const ctx=c.getContext('2d'), img=ctx.createImageData(N,N);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const rgb=fn(y*N+x), o=(y*N+x)*4;
    img.data[o]=rgb[0];img.data[o+1]=rgb[1];img.data[o+2]=rgb[2];img.data[o+3]=255;
  }
  ctx.putImageData(img,0,0);return c.toDataURL();
}
const IMG={
  u:raster(i=>fieldColor(uRe[i],uIm[i],1,true)),
  v:raster(i=>fieldColor(vRe[i],vIm[i],M0,true)),
  z:raster(i=>fieldColor(zRe[i],zIm[i],zmax,true)),
  e:raster(i=>fieldColor(en[i],0,emax,false))
};

/* ---------------- samples used by the narration ---------------- */
const mags=Array.from({length:N*N},(_,i)=>Math.hypot(uRe[i],uIm[i]));
const i0=mags.indexOf(Math.max(...mags));
let i1=-1,i2=-1,b1=1e9,b2=-1e9;
for(let i=0;i<N*N;i++){
  if(i===i0)continue;
  const d=Math.hypot((i%N)-(i0%N),Math.floor(i/N)-Math.floor(i0/N));
  if(d<20)continue;
  const s1=Math.abs(mags[i]-0.42*mags[i0]);       // a clearly weaker sample
  if(s1<b1){b1=s1;i1=i;}
  const dp=1-Math.cos(Math.atan2(uIm[i],uRe[i])-Math.atan2(uIm[i0],uRe[i0]));
  if(dp>b2){b2=dp;i2=i;}                           // 2 = opposite phase
}
const SAMPLES=[i0,i1<0?i0:i1,i2<0?i0:i2];

/* ---------------- svg helpers ---------------- */
function el(tag,attrs,parent,text){
  const n=document.createElementNS(NS,tag);
  if(attrs)for(const k in attrs)n.setAttribute(k,attrs[k]);
  if(text!=null)n.textContent=text;
  if(parent)parent.appendChild(n);
  return n;
}
function txt(parent,x,y,str,cls,fill){
  const n=el('text',{x,y,class:cls||'t-small'},parent,str);
  if(fill)n.setAttribute('fill',fill);
  return n;
}
function op(n,v){n.setAttribute('opacity',v.toFixed(3));n.style.display=v<=0.002?'none':'';}
function arrowPath(cx,cy,x1,y1,head){
  const a=Math.atan2(y1-cy,x1-cx), h=head==null?9:head;
  const bx=x1-h*Math.cos(a-.42), by=y1-h*Math.sin(a-.42);
  const cxx=x1-h*Math.cos(a+.42), cyy=y1-h*Math.sin(a+.42);
  return `M ${cx} ${cy} L ${x1} ${y1} M ${bx} ${by} L ${x1} ${y1} L ${cxx} ${cyy}`;
}
function arcPath(cx,cy,r,a0,a1){
  const p0=[cx+r*Math.cos(a0),cy-r*Math.sin(a0)],p1=[cx+r*Math.cos(a1),cy-r*Math.sin(a1)];
  const large=Math.abs(a1-a0)>Math.PI?1:0, sweep=a1>a0?0:1;
  return `M ${p0[0]} ${p0[1]} A ${r} ${r} 0 ${large} ${sweep} ${p1[0]} ${p1[1]}`;
}
function fmt(v,d){return (Math.abs(v)<1e-12?0:v).toFixed(d==null?3:d);}
function cx2(z){return `${fmt(z.re)} ${z.im<0?'−':'+'} ${fmt(Math.abs(z.im))}i`;}

/* ---------------- scene builders ---------------- */
const S=[];
let root=$('stage');

/* ===== 25 ===== */
(function(){
  const g=el('g',{'data-scene':25},root);
  const P={u:[264,238,200],v:[512,238,200]};
  function panel(cx,cy,size,href,title,sub,color){
    const grp=el('g',{},g);
    el('rect',{x:cx-size/2-8,y:cy-size/2-8,width:size+16,height:size+16,rx:5,fill:'#0b171d',stroke:color,'stroke-opacity':.45},grp);
    el('image',{x:cx-size/2,y:cy-size/2,width:size,height:size,href,style:'image-rendering:pixelated'},grp);
    txt(grp,cx,cy-size/2-24,title,'t-label',color);
    txt(grp,cx,cy+size/2+28,sub,'t-muted');
    return grp;
  }
  const pu=panel(...P.u,IMG.u,'u(r) · 参考场','复数 · 亮度=模长，色相=相角','#7ad5cd');
  const pv=panel(...P.v,IMG.v,'v k̂(r) · 旁带场','同一样品，另一次记录','#b7a5eb');
  const cu=el('rect',{width:P.u[2]/N,height:P.u[2]/N,fill:'none',stroke:'#fff','stroke-width':1.6},pu);
  const cv=el('rect',{width:P.v[2]/N,height:P.v[2]/N,fill:'none',stroke:'#fff','stroke-width':1.6},pv);
  const ru=txt(g,P.u[0],P.u[1]+170,'','t-num');
  const rv=txt(g,P.v[0],P.v[1]+170,'','t-num');

  const px=968,py=232,pr=138;
  el('circle',{cx:px,cy:py,r:pr,fill:'none',stroke:'#36525d'},g);
  el('line',{x1:px-pr-18,y1:py,x2:px+pr+18,y2:py,class:'axis'},g);
  el('line',{x1:px,y1:py-pr-18,x2:px,y2:py+pr+18,class:'axis'},g);
  txt(g,px+pr+24,py+5,'Re','t-muted'); txt(g,px+8,py-pr-22,'Im','t-muted');
  const aU=el('path',{fill:'none',stroke:'#7ad5cd','stroke-width':2.6,'stroke-linecap':'round'},g);
  const aV=el('path',{fill:'none',stroke:'#b7a5eb','stroke-width':2.6,'stroke-linecap':'round'},g);
  const arc=el('path',{fill:'none',stroke:'#efb879','stroke-width':1.8},g);
  const arcHead=el('path',{fill:'none',stroke:'#efb879','stroke-width':1.8},g);
  const radial=el('line',{stroke:'#efb879','stroke-width':1,'stroke-dasharray':'4 4'},g);
  const lU=txt(g,0,0,'u','t-muted','#7ad5cd');
  const lV=txt(g,0,0,'v','t-muted','#b7a5eb');
  const lM=txt(g,0,0,'× m̂','t-small','#efb879');
  const lA=txt(g,0,0,'∠ φ̂Δ','t-small','#efb879');
  const concl=txt(g,720,492,'同一根变换弧：换三个位置，伸缩与转角不变','t-muted');

  const scale=118;
  function draw(p){
    const sel=p<.5?0:p<.786?1:2;
    const idx=SAMPLES[sel];
    const x=idx%N,y=Math.floor(idx/N);
    const step=P.u[2]/N;
    cu.setAttribute('x',P.u[0]-P.u[2]/2+x*step);cu.setAttribute('y',P.u[1]-P.u[2]/2+y*step);
    cv.setAttribute('x',P.v[0]-P.v[2]/2+x*step);cv.setAttribute('y',P.v[1]-P.v[2]/2+y*step);
    ru.textContent='u = '+cx2({re:uRe[idx],im:uIm[idx]});
    rv.textContent='v = '+cx2({re:vRe[idx],im:vIm[idx]});
    const uz={re:uRe[idx]*scale,im:uIm[idx]*scale}, vz={re:vRe[idx]*scale,im:vIm[idx]*scale};
    aU.setAttribute('d',arrowPath(px,py,px+uz.re,py-uz.im));
    aV.setAttribute('d',arrowPath(px,py,px+vz.re,py-vz.im));
    const a0=Math.atan2(uIm[idx],uRe[idx]), a1=a0+PA;
    const rr=Math.hypot(uz.re,uz.im)*0.62;
    op(arc,ramp(p,.22,.34));
    arc.setAttribute('d',arcPath(px,py,rr,a0,a1));
    const ex=px+rr*Math.cos(a1), ey=py-rr*Math.sin(a1), ta=a1+Math.PI/2;
    arcHead.setAttribute('d',arrowPath(px+rr*Math.cos(a1-.06),py-rr*Math.sin(a1-.06),ex,ey,7));
    op(arcHead,ramp(p,.3,.4));
    op(radial,ramp(p,.26,.36));
    radial.setAttribute('x1',px+rr*Math.cos(a1));radial.setAttribute('y1',py-rr*Math.sin(a1));

      {t0:0,t1:1,tex:String.raw`\widetilde A_{+1}=\alpha A_{+1}\quad\Longrightarrow\quad\frac{\widetilde A_{+1}}{\hat\alpha}\approx A_{+1},\qquad \frac{1}{\hat\alpha}=\frac{1}{\hat m}e^{-i\hat\phi_\Delta}`,note:'波浪号仍是第 11 步那个临时旁带：它带着 α 的伸缩与转角。'}
    ]});
})();

/* ===== 29 ===== */
(function(){
  const g=el('g',{'data-scene':29},root);
  const cells=[0,1,2].map(j=>{
    const x=386+j*316;
    const grp=el('g',{},g);
    el('rect',{x:x-118,y:150,width:236,height:74,rx:6,fill:'#0c1b22',stroke:'#b7a5eb','stroke-opacity':.55},grp);
    const name=txt(grp,x,178,'','t-small','#b7a5eb');name.setAttribute('text-anchor','middle');
    const val=txt(grp,x,206,'','t-num');val.setAttribute('text-anchor','middle');
    const badge=el('g',{},grp);
    el('rect',{x:-58,y:-15,width:116,height:30,rx:15,fill:'#1b2b26',stroke:'#efb879'},badge);
    txt(badge,0,6,'× 1/α̂','t-small','#efb879').setAttribute('text-anchor','middle');
    return {grp,name,val,badge,x};
  });
  const frames=[0,1,2].map(j=>{
    const x=386+j*316;
    const n=txt(g,x,300,'','t-label');n.setAttribute('text-anchor','middle');
    return n;
  });
  const merged=el('g',{},g);
  el('rect',{x:-64,y:-17,width:128,height:34,rx:17,fill:'#1b2b26',stroke:'#efb879'},merged);
  txt(merged,0,7,'1/α̂','t-small','#efb879').setAttribute('text-anchor','middle');

  const line1=txt(g,720,420,'','t-title');line1.setAttribute('text-anchor','middle');line1.setAttribute('font-family','Georgia, serif');
  const line2=txt(g,720,462,'','t-muted');line2.setAttribute('text-anchor','middle');
  const num=txt(g,720,512,'','t-num');num.setAttribute('text-anchor','middle');

  const phiP=[0,TAU/3,2*TAU/3];
  const uTil=phiP.map(p=>({re:(2/3)*Math.cos(-p),im:(2/3)*Math.sin(-p)}));
  const uReal=uTil.map(w=>({
    re:(w.re*Math.cos(-PHD)-w.im*Math.sin(-PHD))/M0,
    im:(w.re*Math.sin(-PHD)+w.im*Math.cos(-PHD))/M0
  }));
  function draw(p){
    cells.forEach((c,j)=>{
      const t=ramp(p,.02+j*.06,.18+j*.06);
      op(c.grp,t);
      c.name.textContent=`u₊₁,${j}`;
      c.val.textContent=cx2(uTil[j]);
      const lift=ramp(p,.40,.62);
      c.badge.setAttribute('transform',`translate(${c.x} ${lerp(232,150,lift)})`);
      op(c.badge,ramp(p,.20+j*.05,.32+j*.05)*(1-ramp(p,.58,.66)));
      frames[j].textContent='D'+'₀₁₂'[j];
      op(frames[j],ramp(p,.05,.15));
    });
    const land=ease(ramp(p,.40,.62));
    merged.setAttribute('transform',`translate(${lerp(720,720,land)} ${lerp(300,96,land)}) scale(${lerp(.5,1,land)})`);
    op(merged,ramp(p,.36,.46));
    op(line1,ramp(p,.52,.64));
    line1.textContent='A₊₁ = Σ uⱼ Dⱼ = (1/α̂) Σ ũⱼ Dⱼ = Ã₊₁ / α̂';
    op(line2,ramp(p,.62,.72));
    line2.textContent='因子在三项里完全相同，所以可以先提到 Σ 外面——与第 26 幕是同一个动作';
    op(num,ramp(p,.76,.86));
    const w=uReal[1];
    num.textContent=`u₊₁,₁ = ${fmt(Math.hypot(w.re,w.im))} ∠ ${fmt(Math.atan2(w.im,w.re))} rad  =  (${fmt(w.re)} ${w.im<0?'−':'+'} ${fmt(Math.abs(w.im))}i)`;
  }
  S.push({g,draw,dur:16000,id:29,
    chapter:'09 / 分回三项',
    title:'三项同乘，等于整体补偿。',
    copy:'补偿因子对三帧都一样，所以乘进每个权重、或提到求和外面，结果相同。这一步与第 26 幕的提公因子是同一件事。',
    domain:'频域 · 正式权重',
    formulas:[
      {t0:0,t1:.6,tex:String.raw`u_{+1,j}=\frac{1}{\hat\alpha}\,\widetilde u_{+1,j},\qquad j=0,1,2`,note:'三格同时乘同一个因子，不是只改中间那一格。'},
      {t0:.6,t1:1,tex:String.raw`A_{+1}=\sum_j u_{+1,j}D_j=\frac{1}{\hat\alpha}\sum_j\widetilde u_{+1,j}D_j=\frac{\widetilde A_{+1}}{\hat\alpha}\approx A_{+1}`,note:'右端与第 28 幕的终点是同一个式子，闭环。'}
    ]});
})();

/* ---------------- formula rail ---------------- */
const rail=$('equation'), domainEl=$('domain');
const formulaNodes=[];
S.forEach((s,si)=>{
  s.formulas.forEach(f=>{
    const d=document.createElement('div');
    d.className='fx';
    try{katex.render(f.tex,d,{displayMode:true,throwOnError:false,strict:false});}
    catch(e){d.textContent=f.tex;}
    rail.appendChild(d);
    const n=document.createElement('div');
    n.className='note';n.textContent=f.note||'';
    rail.appendChild(n);
    formulaNodes.push({scene:si,f,d,n});
  });
});

/* ---------------- player ---------------- */
const MAXP=S.length;                       // 0..5 ; scene k occupies [k, k+1]
const stopsEl=$('stops');
const stopNames=['每处相同','提出求和','除出来','倒过来用','分回三项'];
const prog=$('progress'), fill=$('fill'), status=$('status');
prog.setAttribute('max',String(MAXP));

let progress=0, playing=false, last=0, animTarget=null, animStart=0, animFrom=0;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* At an exact integer we are resting on the END of the previous scene,
   which is the stop the reader just watched. */
function locate(p){
  const near=Math.round(p);
  if(near>0 && Math.abs(p-near)<1e-9)return {i:Math.min(S.length-1,near-1),local:1};
  const i=Math.min(S.length-1,Math.max(0,Math.floor(p)));
  return {i,local:Math.min(1,Math.max(0,p-i))};
}
S.forEach((s,i)=>{
  const b=document.createElement('button');
  b.type='button';
  b.innerHTML=`<span class="n">${25+i}</span><span>${stopNames[i]}</span>`;
  b.addEventListener('click',()=>goTo(i+1));
  stopsEl.appendChild(b);
});

function render(){
  const {i,local}=locate(progress);
  S.forEach((s,k)=>{
    const vis=k===i;
    s.g.style.display=vis?'':'none';
    if(vis)s.draw(reduced?1:local);
  });
  const s=S[i];
  $('chapter').textContent=s.chapter;
  $('title').textContent=s.title;
  $('copy').textContent=s.copy;
  $('num').textContent=String(25+i).padStart(2,'0');
  domainEl.textContent=s.domain;
  $('stage-tag').textContent=`幕 ${25+i} / 05`;
  formulaNodes.forEach(o=>{
    const on=o.scene===i && local>=o.f.t0-1e-9 && (local<o.f.t1+1e-9 || o.f.t1>=1-1e-9);
    o.d.style.display=on?'':'none';
    o.n.style.display=on&&o.f.note?'':'none';
  });
  prog.value=String(progress);
  fill.style.width=`${(progress/MAXP)*100}%`;
  status.textContent=local>=0.999?`停在第 ${i+1} 幕终点`
    :local<0.001?`第 ${i+1} 幕起点`
    :`第 ${i+1} 幕 · ${Math.round(local*100)}%`;
  [...stopsEl.children].forEach((b,k)=>b.setAttribute('aria-current',k===i?'true':'false'));
  $('play').innerHTML=playing?'Ⅱ 暂停<span></span>':'▶ 播放<span>→</span>';
}

function tick(t){
  if(!last)last=t;
  const dt=Math.min(80,t-last);last=t;
  if(animTarget!=null){
    const k=Math.min(1,(t-animStart)/520);
    progress=lerp(animFrom,animTarget,ease(k));
    if(k>=1){progress=animTarget;animTarget=null;}
    render();
  }else if(playing){
    const {i,local}=locate(progress);
    if(local>=0.999){
      if(i<S.length-1)progress=i+1+1e-6;   // start the next scene
      else playing=false;
    }else{
      let p=progress+dt/S[i].dur;
      if(p>=i+1){p=i+1;playing=false;}
      progress=p;
    }
    render();
  }
  requestAnimationFrame(tick);
}
function goTo(target){
  animTarget=Math.max(0,Math.min(MAXP,target));
  animFrom=progress;animStart=performance.now();playing=false;
}
function stepNext(){
  const {i,local}=locate(progress);
  goTo(local>=0.999?i+2:i+1);
}
function stepPrev(){
  const {i}=locate(progress);
  goTo(i);
}

$('next').addEventListener('click',stepNext);
$('prev').addEventListener('click',stepPrev);
$('play').addEventListener('click',()=>{
  if(!playing){
    const {i,local}=locate(progress);
    if(local>=0.999){
      if(i<S.length-1)progress=i+1+1e-6;
      else {progress=0;}
    }
  }
  playing=!playing;animTarget=null;last=0;render();
});
$('restart').addEventListener('click',()=>{playing=false;progress=0;animTarget=null;render();});
prog.addEventListener('input',()=>{playing=false;animTarget=null;progress=Number(prog.value);render();});
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){e.preventDefault();stepNext();}
  else if(e.key==='ArrowLeft'){e.preventDefault();stepPrev();}
  else if(e.code==='Space'){e.preventDefault();$('play').click();}
  else if(e.key==='Home'){goTo(0);}
  else if(e.key==='End'){goTo(MAXP);}
});

render();
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
