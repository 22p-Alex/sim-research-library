<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Δα / Δφ 失配伪影对照</title>
<style>
  body{margin:0;padding:20px;background:#0b1020;color:#e2e8f0;font:13px/1.5 -apple-system,"PingFang SC",sans-serif}
  h2{font-size:17px;margin:26px 0 4px;color:#7dd3fc}
  .sub{color:#94a3b8;margin:0 0 12px;font-size:12px}
  .row{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px}
  figure{margin:0;text-align:center}
  figcaption{font-size:11px;color:#94a3b8;margin-top:4px;white-space:nowrap}
  figcaption b{color:#fbbf24;font-weight:600}
  figcaption .bad{color:#f87171}
  canvas{display:block;border-radius:4px;background:#000;image-rendering:pixelated}
  .tag{display:inline-block;width:52px;text-align:right;color:#64748b;font-size:11px;padding-top:64px}
  .note{color:#cbd5e1;background:#131c31;border-left:3px solid #38bdf8;padding:8px 12px;margin:10px 0;border-radius:0 4px 4px 0;font-size:12px}
</style>
</head>
<body>
<div id="out"></div>
<script src="../sim-core.js"></script>
<script src="../sim-experiment.js"></script>
<script>
const C=window.SIMCore,E=window.SIMExperiment,PI=Math.PI,N=128,SQ2=Math.SQRT2;
const sample=C.makeSample(N);
// Noiseless + ideal pupil + known m: artefacts are not masked by noise or by the
// modulation screen, so what you see is purely the effect of the wrong parameter.
const cfg={period:13,exPeriod:9,visibility:.9,kc:1/12,readNoise:0,seed:240924,
  opticsMode:'ideal',spotRadius:.12,decenter:0,balance:1,illumBackground:0,
  electrons:1000,background:0,shotNoise:false,angles:[0,60,120],
  phases:[0,8*PI/12,16*PI/12],directionOn:[true,true,true],phaseOn:[true,true,true]};
const acq=E.capture(sample,N,cfg);
const mods=Object.fromEntries(acq.truth.map(t=>[t.index,t.m]));
const recon=(o)=>E.run(acq.raw,acq.calibration,{eps:.02,errorsAffectEstimator:false,...o},mods).result.pixels;
const rmse=a=>C.rmse(a,sample);

const SCALE=2,W=N*SCALE;
function mk(){const c=document.createElement('canvas');c.width=W;c.height=W;return c;}
function put(cv,fn){
  const ctx=cv.getContext('2d'),img=ctx.createImageData(W,W);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const [r,g,b]=fn(x,y);
    for(let dy=0;dy<SCALE;dy++)for(let dx=0;dx<SCALE;dx++){
      const i=4*((y*SCALE+dy)*W+x*SCALE+dx);
      img.data[i]=r;img.data[i+1]=g;img.data[i+2]=b;img.data[i+3]=255;
    }
  }
  ctx.putImageData(img,0,0);return cv;
}
const gray=v=>{const g=Math.round(255*Math.max(0,Math.min(1,v)));return [g,g,g];};
// Diverging map: reconstruction below truth -> blue, above -> red.
function err(v,s){
  const t=Math.max(-1,Math.min(1,v/s));
  return t>=0?[255,Math.round(255*(1-t)),Math.round(255*(1-t*.85))]
             :[Math.round(255*(1+t)),Math.round(255*(1+t*.85)),255];
}
function spectrum(px){
  const re=Float64Array.from(px),im=new Float64Array(N*N);C.fft2(re,im,N);
  const out=new Float64Array(N*N);let mx=0;
  for(let i=0;i<N*N;i++){out[i]=Math.log(1+Math.hypot(re[i],im[i]));mx=Math.max(mx,out[i]);}
  return {out,mx};
}
function fig(caption,cv){
  const f=document.createElement('figure');f.append(cv);
  const c=document.createElement('figcaption');c.innerHTML=caption;f.append(c);return f;
}
function row(label,kids){
  const d=document.createElement('div');d.className='row';
  const t=document.createElement('span');t.className='tag';t.textContent=label;d.append(t);
  for(const k of kids)d.append(k);
  return d;
}
function h2(t){const e=document.createElement('h2');e.textContent=t;cur.append(e);}
function p(t,cls){const e=document.createElement('p');e.className=cls||'sub';e.innerHTML=t;cur.append(e);}
const root=document.getElementById('out');
function panel(id){const d=document.createElement('div');d.id=id;d.style.marginBottom='34px';root.append(d);return d;}
let cur=panel('p1');
const ERRSCALE=.18;

// ---------- Panel 1: angle mismatch ----------
h2('① 角度校准偏差 Δα：频带被搬到错误的位置');
p('无噪声 · 理想点光束 · 已知调制度真值 · 失配仅作用于重建。样品为三组 7.5 px 条纹盘（方向 0°/60°/120°）。');
const angCases=[[0,'Δα=0°'],[1,'Δα=1°'],[3,'Δα=3°'],[6,'Δα=6°'],[12,'Δα=12°']];
const angRes=angCases.map(([a])=>recon({angleError:a}));
const wfRMSE=C.rmse(acq.widefield,sample);
cur.append(row('重建图像',[fig('<b>样品真值</b>',put(mk(),(x,y)=>gray(sample[y*N+x]))),
  ...angCases.map(([a,lab],i)=>fig(`${lab}<br><b class="${rmse(angRes[i])>wfRMSE?'bad':''}">RMSE ${rmse(angRes[i]).toFixed(4)}</b>`,
    put(mk(),(x,y)=>gray(angRes[i][y*N+x]))))]));
cur.append(row('频谱 log|F|',angCases.map(([a,lab],i)=>{const s=spectrum(angRes[i]);
  return fig(lab,put(mk(),(x,y)=>{const v=s.out[((y+N/2)%N)*N+(x+N/2)%N]/s.mx;return gray(v);}));})));
cur.append(row('误差图 ±0.18',angCases.map(([a,lab],i)=>fig(lab,
  put(mk(),(x,y)=>err(angRes[i][y*N+x]-sample[y*N+x],ERRSCALE))))));
p('宽场参考 RMSE = '+wfRMSE.toFixed(4)+'。红色 RMSE 表示<b>比不做 SIM 还差</b>。注意频谱图：Δα 让六个频带瓣各自绕中心旋转错位，支撑域边界（切趾窗）与实际频带不再重合。','note');

// ---------- Panel 2: phase mismatch ----------
cur=panel('p2');
h2('② 公共相位原点偏差 Δφ：真实结构与正交伪结构按 cos:sin 混合');
const phCases=[[0,'Δφ=0'],[2,'Δφ=π/6'],[3,'Δφ=π/4'],[4,'Δφ=π/3'],[6,'Δφ=π/2']];
const phRes=phCases.map(([k])=>recon({phaseError:k*PI/12}));
cur.append(row('重建图像',[fig('<b>样品真值</b>',put(mk(),(x,y)=>gray(sample[y*N+x]))),
  ...phCases.map(([k,lab],i)=>fig(`${lab}<br><b class="${rmse(phRes[i])>wfRMSE?'bad':''}">RMSE ${rmse(phRes[i]).toFixed(4)}</b>`,
    put(mk(),(x,y)=>gray(phRes[i][y*N+x]))))]));
cur.append(row('频谱 log|F|',phCases.map(([k,lab],i)=>{const s=spectrum(phRes[i]);
  return fig(lab,put(mk(),(x,y)=>{const v=s.out[((y+N/2)%N)*N+(x+N/2)%N]/s.mx;return gray(v);}));})));
cur.append(row('误差图 ±0.18',phCases.map(([k,lab],i)=>fig(lab,
  put(mk(),(x,y)=>err(phRes[i][y*N+x]-sample[y*N+x],ERRSCALE))))));

// Exact decomposition: recon(Δφ) = A + cos(Δφ)·U + sin(Δφ)·V  (verified to 1e-16)
const R0=recon({}),Rh=recon({phaseError:PI/2}),R45=recon({phaseError:PI/4});
const A=Float64Array.from(R45,(_,i)=>(R45[i]-(R0[i]+Rh[i])/SQ2)/(1-SQ2));
const U=Float64Array.from(R0,(_,i)=>R0[i]-A[i]);
const V=Float64Array.from(Rh,(_,i)=>Rh[i]-A[i]);
p('下面的分解是<b>精确</b>的（回代残差 1e-16）：<code>recon(Δφ) = A + cos(Δφ)·U + sin(Δφ)·V</code>。'+
  'U 是真实超分辨贡献，V 是与 U 正交、能量相等的伪结构（‖V‖/‖U‖=1.000，归一化内积 1e-6）。'+
  'Δφ 不衰减任何能量，只是把 U 按比例换成 V。','note');
cur.append(row('分量分解',[
  fig('<b>A</b> 零级贡献<br>RMSE '+rmse(A).toFixed(4),put(mk(),(x,y)=>gray(A[y*N+x]))),
  fig('<b>U</b> 真实超分辨<br>（Δφ=0 的一级贡献）',put(mk(),(x,y)=>gray(U[y*N+x]/.5+.5))),
  fig('<b>V</b> 正交伪结构<br>（Δφ=π/2 的一级贡献）',put(mk(),(x,y)=>gray(V[y*N+x]/.5+.5))),
  fig('A+U = recon(0)<br><b>RMSE '+rmse(R0).toFixed(4)+'</b>',put(mk(),(x,y)=>gray(R0[y*N+x]))),
  fig('A+V = recon(π/2)<br><b class="bad">RMSE '+rmse(Rh).toFixed(4)+'</b>',put(mk(),(x,y)=>gray(Rh[y*N+x])))]));
cur.append(row('频谱 log|F|',[fig('A',(()=>{const s=spectrum(A);return put(mk(),(x,y)=>gray(s.out[((y+N/2)%N)*N+(x+N/2)%N]/s.mx));})()),
  fig('U',(()=>{const s=spectrum(U);return put(mk(),(x,y)=>gray(s.out[((y+N/2)%N)*N+(x+N/2)%N]/s.mx));})()),
  fig('V',(()=>{const s=spectrum(V);return put(mk(),(x,y)=>gray(s.out[((y+N/2)%N)*N+(x+N/2)%N]/s.mx));})()),
  fig('recon(0)',(()=>{const s=spectrum(R0);return put(mk(),(x,y)=>gray(s.out[((y+N/2)%N)*N+(x+N/2)%N]/s.mx));})()),
  fig('recon(π/2)',(()=>{const s=spectrum(Rh);return put(mk(),(x,y)=>gray(s.out[((y+N/2)%N)*N+(x+N/2)%N]/s.mx));})())]));
p('关键对照：<b>Δφ 那一行的频谱图几乎完全一样</b>（一级频带能量在 Δφ=π/2 时仍保留 99.6%），'+
  '而 Δα 的频谱明显错位变形。所以角度偏差可以在频谱上看见，<b>相位偏差在频谱幅度上完全隐身</b>——只能靠互相关的虚部残差发现。','note');

// ---------- Panel 3: single direction, to expose ghost direction ----------
cur=panel('p3');
h2('③ 只开一个方向（0°）：暴露重影的方向性');
const cfg1={...cfg,directionOn:[true,false,false]};
const acq1=E.capture(sample,N,cfg1),mods1=Object.fromEntries(acq1.truth.map(t=>[t.index,t.m]));
const rec1=(o)=>E.run(acq1.raw,acq1.calibration,{eps:.02,...o},mods1).result.pixels;
const wf1=C.rmse(acq1.widefield,sample);
cur.append(row('Δα 扫描',[fig('<b>真值</b>',put(mk(),(x,y)=>gray(sample[y*N+x]))),
  ...[0,1,2,4,8].map(a=>{const r=rec1({angleError:a});
    return fig(`Δα=${a}°<br><b class="${rmse(r)>wf1?'bad':''}">${rmse(r).toFixed(4)}</b>`,put(mk(),(x,y)=>gray(r[y*N+x])));})]));
cur.append(row('Δφ 扫描',[fig('<b>真值</b>',put(mk(),(x,y)=>gray(sample[y*N+x]))),
  ...[0,2,3,4,6].map(k=>{const r=rec1({phaseError:k*PI/12});
    return fig(`${k}π/12<br><b class="${rmse(r)>wf1?'bad':''}">${rmse(r).toFixed(4)}</b>`,put(mk(),(x,y)=>gray(r[y*N+x])));})]));
p('单方向下更容易看清：<b>Δα 使条纹整体旋转错位</b>（频带沿切向搬到错误角度），'+
  '<b>Δφ 使条纹沿照明方向出现重影</b>（V 分量相对 U 的位移实测约 2 px，方向严格沿 k<sub>i</sub>）。宽场参考 RMSE = '+wf1.toFixed(4)+'。','note');
</script>
</body>
</html>
