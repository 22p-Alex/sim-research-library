<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIM 光路模拟 · 从激光到成像</title>
<style>
/* ─── 全局样式 ─── */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0e17;--surface:#111827;--border:#1e293b;
  --text:#e2e8f0;--text-dim:#94a3b8;--accent:#60a5fa;
  --blue:#3b82f6;--green:#10b981;--cyan:#22d3ee;
}
body{
  background:var(--bg);color:var(--text);
  font:16px/1.6 "SF Pro Text","Helvetica Neue",sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:2rem 1rem;
}
h1{
  font:700 1.6rem/1.3 "SF Pro Display","Helvetica Neue",sans-serif;
  letter-spacing:-0.02em;margin-bottom:.25rem;
}
.subtitle{color:var(--text-dim);font-size:.9rem;margin-bottom:1.5rem}

/* ─── 控制栏 ─── */
.controls{display:flex;gap:.5rem;margin-bottom:1.2rem;flex-wrap:wrap;justify-content:center}
.controls button{
  background:var(--surface);border:1px solid var(--border);color:var(--text-dim);
  padding:.45rem 1.1rem;border-radius:6px;cursor:pointer;font-size:.85rem;
  transition:all .2s;
}
.controls button:hover{border-color:var(--accent);color:var(--text)}
.controls button.active{
  background:var(--accent);border-color:var(--accent);color:#0a0e17;font-weight:600;
}

/* ─── SVG 容器 ─── */
.svg-wrap{
  width:100%;max-width:1440px;overflow-x:auto;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:1rem;margin-bottom:1.2rem;
}
svg text{font-family:"SF Mono","Fira Code",monospace}

/* ─── 信息面板 ─── */
.info-panel{
  width:100%;max-width:1440px;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:1.5rem;min-height:120px;
  transition:border-color .3s;
}
.info-panel.highlight{border-color:var(--accent)}
.info-panel h2{font-size:1.1rem;color:var(--accent);margin-bottom:.5rem}
.info-panel p{color:var(--text-dim);font-size:.92rem;line-height:1.7}
.info-panel .formula{
  font-family:"SF Mono","Fira Code",monospace;
  background:#1a2332;padding:.4rem .8rem;border-radius:6px;
  display:inline-block;margin-top:.5rem;color:var(--cyan);font-size:.85rem;
}
.info-hint{color:var(--text-dim);font-style:italic;opacity:.6}

/* ─── Tooltip ─── */
.tooltip{
  position:fixed;pointer-events:none;z-index:999;
  background:#1e293b;border:1px solid var(--border);color:var(--text);
  padding:.4rem .75rem;border-radius:6px;font-size:.8rem;
  box-shadow:0 4px 12px rgba(0,0,0,.5);
  opacity:0;transition:opacity .15s;
  max-width:260px;
}
.tooltip.show{opacity:1}

/* ─── 动画关键帧 ─── */
@keyframes beamFlow{to{stroke-dashoffset:-24}}
@keyframes beamFlowReverse{to{stroke-dashoffset:24}}
@keyframes pulseGlow{
  0%,100%{opacity:.4}50%{opacity:1}
}
@keyframes fringeMove{
  0%{transform:translateX(0)}100%{transform:translateX(12px)}
}
</style>
</head>
<body>

<h1>SIM 光路模拟</h1>
<p class="subtitle">结构光照明显微镜完整光路：激发干涉 → 荧光发射 → 成像探测</p>

<div class="controls">
  <button class="active" data-mode="all">全系统</button>
  <button data-mode="excitation">激发臂</button>
  <button data-mode="detection">探测臂</button>
</div>

<div class="svg-wrap">
  <svg id="opticalSvg" viewBox="0 0 1400 620" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<div class="info-panel" id="infoPanel">
  <p class="info-hint">点击光路图中的光学元件，查看其物理原理说明。</p>
</div>

<!-- Tooltip 元素 -->
<div class="tooltip" id="tooltip"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
 * SIM 光路模拟 — 单文件交互页面
 * 物理依据：知识库 01-SIM基础与频谱直觉 / 02-统一成像模型与SIM分类
 * ═══════════════════════════════════════════════════════════════ */
(function(){
'use strict';

const SVG_NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('opticalSvg');
const tooltip = document.getElementById('tooltip');
const infoPanel = document.getElementById('infoPanel');

// ─── 元件数据库：名称、简述、详细说明 ───
const COMPONENTS = {
  laser: {
    name: '激光源 (488 nm)',
    tip: '488nm 相干激光源，提供单色高亮度激发光',
    detail: '固态激光器输出 488 nm 线偏振相干光。单色性保证经 SLM 衍射后各级次不色散；相干性是样品面形成稳定干涉条纹的前提。典型功率 50–200 mW，经衰减后到达样品面约 1–10 kW/cm²。',
    arm: 'excitation'
  },
  expander: {
    name: '扩束准直系统',
    tip: '将激光束扩展至 SLM 有效口径所需的直径（~10 mm）',
    detail: '由一对透镜组成的无焦扩束系统（焦距比 f₂/f₁ 决定倍率）。将激光器输出的细束（~1 mm）扩展至 SLM 有效面积所需的口径，同时保证波前平坦（准直），使 SLM 上各处相位调制一致。',
    arm: 'excitation'
  },
  slm: {
    name: 'SLM / 相位光栅',
    tip: '加载正弦相位图案，将入射光衍射为 0 级和 ±1 级',
    detail: '空间光调制器（SLM）加载计算机生成的正弦相位光栅 φ(x) = A·sin(2πx/Λ + φ₀)。入射平面波经相位调制后产生多级衍射：0 级（未偏转）和 ±1 级（偏转 ±θ）。通过切换光栅相位 φ₀ 实现条纹相移；切换光栅方向角实现多方向照明。等效于产生三束平面波 E₀ + E₊₁ + E₋₁。',
    arm: 'excitation',
    formula: 'φ(x) = A·sin(2πx/Λ + φ₀)'
  },
  lensL1: {
    name: '傅里叶透镜 L1',
    tip: '将 SLM 出射的各级衍射光聚焦到频谱面上',
    detail: '焦距 f₁ 的傅里叶变换透镜。将 SLM（位于前焦面）出射的各级衍射光聚焦到后焦面（频谱面）上。0 级聚焦于光轴，±1 级聚焦于光轴两侧 ±f₁·sinθ 处，形成三个分离的焦点。这是 4f 中继系统的前半段。',
    arm: 'excitation'
  },
  mask: {
    name: '掩模（频谱面光阑）',
    tip: '阻挡 0 级直流光，仅让 ±1 级通过，提高条纹对比度至 m=1',
    detail: '位于 L1 后焦面的金属掩模板，中心开孔被阻挡（挡住 0 级直流光），两侧 ±1 级位置开口放行。去除 0 级后，样品面照明变为纯余弦条纹 I = I₀[1 + m·cos(2πk·r + φ)]，调制度理论值 m→1（实际 ~0.7–0.9 受衍射效率与对准影响）。若保留 0 级，m 下降至 0.3–0.5，分辨率增益大打折扣。',
    arm: 'excitation',
    formula: 'I = I₀[1 + m·cos(2πk·r + φ)], m → 1'
  },
  lensL2: {
    name: '中继透镜 L2',
    tip: '4f 系统后半段，将掩模面像传递至 BFP',
    detail: '焦距 f₂ 的中继透镜，与 L1 组成 4f 系统。将掩模频谱面上通过的 ±1 级光重新准直并中继到物镜后焦面（BFP）。放大倍率 M = f₂/f₁ 决定了 ±1 级焦点在 BFP 上的间距，进而决定照明条纹的空间频率 k = NA·sinα/λ。',
    arm: 'excitation'
  },
  dichroic: {
    name: '二向色镜',
    tip: '45° 放置，反射 488nm 激发光，透射荧光（>500nm）',
    detail: '长通二向色分光镜，以 45° 角放置在激发/发射共用光路中。对 488 nm 激发光高反射（R>95%），将水平光束转折 90° 向下进入物镜；对 >500 nm 的荧光高透射（T>90%），使样品发射的荧光穿过它进入探测臂。这一元件实现了落射荧光（epi-fluorescence）配置中激发与发射光路的分离。',
    arm: 'both'
  },
  bfp: {
    name: 'BFP（后焦面）',
    tip: '±1 级光在 BFP 形成两个实焦点，出射后在样品面干涉',
    detail: '物镜后焦面（Back Focal Plane）是照明角度编码的关键共轭面。经掩模筛选后的 ±1 级光在 BFP 上形成两个对称的实焦点，位于光轴两侧 ±r 处（r = f_obj·sinθ）。这两个焦点相当于两个不同方向入射的平面波源：从 BFP 出射后，两束倾斜平面波在样品面交汇干涉，形成正弦条纹 I = I₀[1 + m·cos(2πk·r + φ)]，其中 k 由两焦点间距决定。',
    arm: 'excitation',
    formula: 'k = 2·r/(f_obj·λ), α = arcsin(r/f_obj)'
  },
  objective: {
    name: '物镜 (100×, NA 1.49)',
    tip: '高数值孔径油浸物镜，同时负责激发光聚焦和荧光收集',
    detail: '100× 油浸物镜，数值孔径 NA = 1.49（超越空气极限 NA=1.0，需折射率匹配油 n=1.515）。在 SIM 中承担双重角色：(1) 将 BFP 上的 ±1 级焦点转换为样品面上 ±α 角度入射的两束平面波；(2) 收集样品发射的荧光并成像到相机面。高 NA 保证更大的 OTF 截止频率，SIM 最终分辨率 ~λ/(4·NA) ≈ 82 nm。',
    arm: 'both'
  },
  sample: {
    name: '样品面（干涉条纹）',
    tip: '两束 ±α 倾斜平面波在此干涉，形成正弦结构光照明',
    detail: '样品位于物镜焦平面。两束以 ±α 角入射的相干平面波在此干涉，产生正弦强度分布：I(r) = I₀[1 + m·cos(2πk·r + φ)]。荧光分子按此强度分布被激发，等效于用照明条纹对样品进行"频率编码"。通过切换 SLM 相位 φ 获得 3 帧相移图像，切换方向 θ 获得多角度数据，最终通过频域解混实现超分辨重建。',
    arm: 'both',
    formula: 'I(r) = I₀[1 + m·cos(2πk·r + φ)]'
  },
  emFilter: {
    name: '发射滤光片',
    tip: '带通滤光片，仅透过荧光波段，阻挡残余激发光',
    detail: '带通或长通滤光片，中心波长匹配荧光染料发射谱（如 GFP: 510–550 nm）。阻挡任何未被二向色镜反射的残余 488 nm 激发光及杂散光，确保相机仅记录纯荧光信号。光学密度 OD>6 对应抑制比 10⁶，对消除激发光背景至关重要。',
    arm: 'detection'
  },
  tubeLens: {
    name: '成像筒镜',
    tip: '将物镜出射的无限远光束聚焦到相机传感器面',
    detail: '无限远校正光学系统中的筒镜（Tube Lens），焦距通常 200 mm。将物镜出射的平行光束会聚，在相机传感器面形成样品的实像。系统总放大倍率 M_total = f_tube/f_obj × M_obj，决定了样品面到相机面的像素对应关系（典型 ~100 nm/pixel）。',
    arm: 'detection'
  },
  camera: {
    name: 'sCMOS 相机',
    tip: '科学级 CMOS 传感器，高量子效率低噪声快速成像',
    detail: '科学级互补金属氧化物半导体（sCMOS）探测器。典型参数：量子效率 QE>80%@520nm、读出噪声 <2 e⁻、帧率 30–100 fps、像素尺寸 6.5 μm。SIM 需要每个方向/相位组合采集一帧，典型 3 方向×5 相位 = 15 帧原始数据。高 QE 和低噪声保证光子预算充足时的重建质量。',
    arm: 'detection'
  }
};

// ─── SVG 工具函数 ───
function el(tag, attrs, parent) {
  const e = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}

// ─── 绘制辅助 ───
function drawLens(parent, cx, cy, h, label) {
  // 双凸透镜：两个对称弧
  const g = el('g', {class:'component','data-id':label}, parent);
  const r = h * 0.9;
  const path = `M${cx},${cy-h} Q${cx+h*0.3},${cy} ${cx},${cy+h} Q${cx-h*0.3},${cy} ${cx},${cy-h}`;
  el('path', {d:path, fill:'rgba(96,165,250,0.12)', stroke:'#60a5fa', 'stroke-width':'1.5'}, g);
  return g;
}

function drawBeam(parent, points, color, dashAnim, cls) {
  const d = points.map((p,i) => (i===0?'M':'L')+p[0]+','+p[1]).join(' ');
  const beam = el('path', {
    d, fill:'none', stroke:color, 'stroke-width':'2.5',
    'stroke-dasharray':'8,4', 'stroke-linecap':'round',
    class: (cls||'') + ' beam-line',
    style: `animation:${dashAnim} 1.2s linear infinite`
  }, parent);
  return beam;
}

function drawArrow(parent, x, y, angle, color) {
  const g = el('g', {transform:`translate(${x},${y}) rotate(${angle})`}, parent);
  el('polygon', {points:'0,-4 8,0 0,4', fill:color, opacity:'0.9'}, g);
  return g;
}

// ─── 主绘制函数 ───
function buildOpticalPath() {
  svg.innerHTML = '';
  
  // 定义渐变和滤镜
  const defs = el('defs', {}, svg);
  
  // 蓝色光束发光
  const glowBlue = el('filter', {id:'glowBlue', x:'-50%', y:'-50%', width:'200%', height:'200%'}, defs);
  el('feGaussianBlur', {in:'SourceGraphic', stdDeviation:'3', result:'blur'}, glowBlue);
  el('feMerge', {}, glowBlue).innerHTML = '<feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/>';
  
  // 绿色光束发光
  const glowGreen = el('filter', {id:'glowGreen', x:'-50%', y:'-50%', width:'200%', height:'200%'}, defs);
  el('feGaussianBlur', {in:'SourceGraphic', stdDeviation:'3', result:'blur'}, glowGreen);
  el('feMerge', {}, glowGreen).innerHTML = '<feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/>';

  // 干涉条纹图案
  const fringePat = el('pattern', {id:'fringePattern', x:'0', y:'0', width:'12', height:'12', patternUnits:'userSpaceOnUse'}, defs);
  el('rect', {x:'0', y:'0', width:'12', height:'12', fill:'#0f172a'}, fringePat);
  el('rect', {x:'0', y:'0', width:'6', height:'12', fill:'rgba(59,130,246,0.5)'}, fringePat);
  
  // SLM 条纹图案
  const slmPat = el('pattern', {id:'slmPattern', x:'0', y:'0', width:'8', height:'8', patternUnits:'userSpaceOnUse'}, defs);
  el('rect', {x:'0', y:'0', width:'8', height:'8', fill:'#1e1b4b'}, slmPat);
  el('rect', {x:'0', y:'0', width:'4', height:'8', fill:'rgba(139,92,246,0.5)'}, slmPat);

  // ═══ 层组 ═══
  const beamLayer = el('g', {id:'beamLayer', filter:'url(#glowBlue)'}, svg);
  const greenBeamLayer = el('g', {id:'greenBeamLayer', filter:'url(#glowGreen)'}, svg);
  const compLayer = el('g', {id:'compLayer'}, svg);
  const labelLayer = el('g', {id:'labelLayer'}, svg);

  // ═══ 坐标定义 ═══
  const EX_Y = 300;  // 激发臂水平 y 坐标
  const DICH_X = 820; // 二向色镜 x
  const SAMPLE_Y = 540;
  const DET_Y = 140;  // 探测臂水平 y

  // ─── 激发臂元件 ───
  
  // 1. 激光器
  const laserG = el('g', {class:'component','data-id':'laser', cursor:'pointer'}, compLayer);
  el('rect', {x:35, y:EX_Y-18, width:70, height:36, rx:4, fill:'#1e293b', stroke:'#3b82f6', 'stroke-width':'1.5'}, laserG);
  el('rect', {x:105, y:EX_Y-6, width:20, height:12, rx:2, fill:'#3b82f6', opacity:'0.8'}, laserG);
  el('text', {x:70, y:EX_Y+5, 'text-anchor':'middle', fill:'#93c5fd', 'font-size':'11', 'font-weight':'600'}, laserG).textContent = '488nm';
  
  // 2. 扩束准直 (两个透镜)
  const expG = el('g', {class:'component','data-id':'expander', cursor:'pointer'}, compLayer);
  drawLens(expG, 175, EX_Y, 14, 'expander');
  drawLens(expG, 215, EX_Y, 24, 'expander');
  
  // 3. SLM
  const slmG = el('g', {class:'component','data-id':'slm', cursor:'pointer'}, compLayer);
  el('rect', {x:310, y:EX_Y-40, width:16, height:80, rx:2, fill:'url(#slmPattern)', stroke:'#8b5cf6', 'stroke-width':'1.5'}, slmG);
  // SLM 衍射效果：三条出射光
  el('line', {x1:326, y1:EX_Y, x2:360, y2:EX_Y-20, stroke:'#60a5fa', 'stroke-width':'0.8', opacity:'0.4', 'stroke-dasharray':'3,2'}, slmG);
  el('line', {x1:326, y1:EX_Y, x2:360, y2:EX_Y, stroke:'#60a5fa', 'stroke-width':'0.8', opacity:'0.4', 'stroke-dasharray':'3,2'}, slmG);
  el('line', {x1:326, y1:EX_Y, x2:360, y2:EX_Y+20, stroke:'#60a5fa', 'stroke-width':'0.8', opacity:'0.4', 'stroke-dasharray':'3,2'}, slmG);
  
  // 4. 傅里叶透镜 L1
  const l1G = el('g', {class:'component','data-id':'lensL1', cursor:'pointer'}, compLayer);
  drawLens(l1G, 440, EX_Y, 32, 'lensL1');
  
  // 5. 掩模频谱面
  const maskG = el('g', {class:'component','data-id':'mask', cursor:'pointer'}, compLayer);
  el('rect', {x:555, y:EX_Y-38, width:10, height:76, rx:1, fill:'#1e293b', stroke:'#64748b', 'stroke-width':'1'}, maskG);
  // 0级阻挡 (中心×)
  el('line', {x1:556, y1:EX_Y-5, x2:564, y2:EX_Y+5, stroke:'#ef4444', 'stroke-width':'2'}, maskG);
  el('line', {x1:564, y1:EX_Y-5, x2:556, y2:EX_Y+5, stroke:'#ef4444', 'stroke-width':'2'}, maskG);
  // ±1级通过孔
  el('circle', {cx:560, cy:EX_Y-22, r:5, fill:'none', stroke:'#10b981', 'stroke-width':'1.5'}, maskG);
  el('circle', {cx:560, cy:EX_Y+22, r:5, fill:'none', stroke:'#10b981', 'stroke-width':'1.5'}, maskG);
  
  // 6. 中继透镜 L2
  const l2G = el('g', {class:'component','data-id':'lensL2', cursor:'pointer'}, compLayer);
  drawLens(l2G, 680, EX_Y, 32, 'lensL2');
  
  // 7. 二向色镜
  const dichG = el('g', {class:'component','data-id':'dichroic', cursor:'pointer'}, compLayer);
  el('line', {x1:DICH_X-25, y1:EX_Y+25, x2:DICH_X+25, y2:EX_Y-25, stroke:'#f59e0b', 'stroke-width':'3', 'stroke-linecap':'round'}, dichG);
  el('line', {x1:DICH_X-25, y1:EX_Y+25, x2:DICH_X+25, y2:EX_Y-25, stroke:'#fbbf24', 'stroke-width':'1', opacity:'0.5'}, dichG);
  
  // 8. BFP
  const bfpG = el('g', {class:'component','data-id':'bfp', cursor:'pointer'}, compLayer);
  el('circle', {cx:DICH_X, cy:380, r:22, fill:'none', stroke:'#475569', 'stroke-width':'1.5', 'stroke-dasharray':'4,2'}, bfpG);
  // ±1级两个焦点
  el('circle', {cx:DICH_X-10, cy:380, r:4, fill:'#3b82f6'}, bfpG);
  el('circle', {cx:DICH_X+10, cy:380, r:4, fill:'#3b82f6'}, bfpG);
  
  // 9. 物镜
  const objG = el('g', {class:'component','data-id':'objective', cursor:'pointer'}, compLayer);
  const objPath = `M${DICH_X-30},${440} L${DICH_X-18},${470} L${DICH_X-12},${490} L${DICH_X+12},${490} L${DICH_X+18},${470} L${DICH_X+30},${440} Z`;
  el('path', {d:objPath, fill:'rgba(71,85,105,0.3)', stroke:'#94a3b8', 'stroke-width':'1.5'}, objG);
  
  // 10. 样品面
  const sampG = el('g', {class:'component','data-id':'sample', cursor:'pointer'}, compLayer);
  el('rect', {x:DICH_X-40, y:SAMPLE_Y-8, width:80, height:16, rx:3, fill:'url(#fringePattern)', stroke:'#3b82f6', 'stroke-width':'1'}, sampG);
  // 荧光发射标记
  el('rect', {x:DICH_X-35, y:SAMPLE_Y+10, width:70, height:4, rx:2, fill:'#10b981', opacity:'0.6'}, sampG);
  
  // 11. 发射滤光片
  const emfG = el('g', {class:'component','data-id':'emFilter', cursor:'pointer'}, compLayer);
  el('rect', {x:960, y:DET_Y-28, width:12, height:56, rx:2, fill:'rgba(16,185,129,0.15)', stroke:'#10b981', 'stroke-width':'1.5'}, emfG);
  
  // 12. 成像筒镜
  const tlG = el('g', {class:'component','data-id':'tubeLens', cursor:'pointer'}, compLayer);
  drawLens(tlG, 1100, DET_Y, 28, 'tubeLens');
  
  // 13. sCMOS 相机
  const camG = el('g', {class:'component','data-id':'camera', cursor:'pointer'}, compLayer);
  el('rect', {x:1220, y:DET_Y-22, width:50, height:44, rx:4, fill:'#1e293b', stroke:'#10b981', 'stroke-width':'1.5'}, camG);
  el('rect', {x:1228, y:DET_Y-14, width:34, height:28, rx:2, fill:'#064e3b', stroke:'#10b981', 'stroke-width':'0.8'}, camG);
  // 像素网格
  for(let i=0;i<4;i++) for(let j=0;j<3;j++){
    el('rect', {x:1231+i*8, y:DET_Y-11+j*9, width:6, height:7, fill:'rgba(16,185,129,0.3)', rx:'1'}, camG);
  }

  // ─── 光束路径 ───
  
  // 激发光束（蓝色）：激光 → 扩束 → SLM → L1 → 掩模 → L2 → 二向色镜 → 反射向下 → BFP → 物镜 → 样品
  const excPoints = [
    [125, EX_Y], [165, EX_Y], [175, EX_Y], [215, EX_Y],
    [310, EX_Y], [326, EX_Y],
    [440, EX_Y], [555, EX_Y], [565, EX_Y],
    [680, EX_Y], [DICH_X, EX_Y],
    [DICH_X, 380], [DICH_X, 440], [DICH_X, 490], [DICH_X, SAMPLE_Y]
  ];
  drawBeam(beamLayer, excPoints, '#3b82f6', 'beamFlow', 'excitation-beam');
  
  // 激发光方向箭头
  drawArrow(beamLayer, 145, EX_Y, 0, '#3b82f6');
  drawArrow(beamLayer, 370, EX_Y, 0, '#3b82f6');
  drawArrow(beamLayer, 630, EX_Y, 0, '#3b82f6');
  drawArrow(beamLayer, DICH_X, 420, 90, '#3b82f6');
  drawArrow(beamLayer, DICH_X, SAMPLE_Y-20, 90, '#3b82f6');
  
  // 探测光束（绿色）：样品 → 物镜 → 二向色镜(透射) → 向上 → 转向右 → 发射滤光片 → 筒镜 → 相机
  const detPoints = [
    [DICH_X+3, SAMPLE_Y], [DICH_X+3, 490], [DICH_X+3, 440],
    [DICH_X+3, 380], [DICH_X+3, EX_Y],
    [DICH_X+3, DET_Y+20], [DICH_X+3, DET_Y],
    [900, DET_Y], [960, DET_Y], [972, DET_Y],
    [1100, DET_Y], [1220, DET_Y]
  ];
  drawBeam(greenBeamLayer, detPoints, '#10b981', 'beamFlowReverse', 'detection-beam');
  
  // 探测光方向箭头
  drawArrow(greenBeamLayer, DICH_X+3, SAMPLE_Y-40, -90, '#10b981');
  drawArrow(greenBeamLayer, DICH_X+3, 220, -90, '#10b981');
  drawArrow(greenBeamLayer, 940, DET_Y, 0, '#10b981');
  drawArrow(greenBeamLayer, 1180, DET_Y, 0, '#10b981');
  
  // 二向色镜处转向标记
  el('path', {
    d:`M${DICH_X-8},${EX_Y+8} Q${DICH_X-20},${EX_Y-20} ${DICH_X-5},${DET_Y+40}`,
    fill:'none', stroke:'#10b981', 'stroke-width':'1', opacity:'0.3', 'stroke-dasharray':'3,3'
  }, greenBeamLayer);

  // ─── 干涉动画（样品面） ───
  const interferenceG = el('g', {id:'interferenceAnim', class:'excitation-elem'}, svg);
  // 两束入射光交汇
  el('line', {x1:DICH_X-20, y1:SAMPLE_Y-50, x2:DICH_X, y2:SAMPLE_Y, stroke:'#3b82f6', 'stroke-width':'1.5', opacity:'0.6'}, interferenceG);
  el('line', {x1:DICH_X+20, y1:SAMPLE_Y-50, x2:DICH_X, y2:SAMPLE_Y, stroke:'#3b82f6', 'stroke-width':'1.5', opacity:'0.6'}, interferenceG);
  // 动态条纹
  const fringeAnim = el('g', {style:'animation:fringeMove 2s linear infinite'}, interferenceG);
  for(let i=-3;i<=3;i++){
    el('rect', {
      x: DICH_X + i*6 - 2, y: SAMPLE_Y - 6,
      width: 3, height: 12, rx: 1,
      fill: i%2===0 ? 'rgba(59,130,246,0.7)' : 'rgba(59,130,246,0.1)'
    }, fringeAnim);
  }

  // ─── 标签 ───
  const labels = [
    [70, EX_Y+40, '激光源'], [195, EX_Y+44, '扩束准直'],
    [318, EX_Y+56, 'SLM'], [440, EX_Y+48, 'L1'],
    [560, EX_Y+54, '掩模'], [680, EX_Y+48, 'L2'],
    [DICH_X+35, EX_Y-30, '二向色镜'],
    [DICH_X+32, 380, 'BFP'], [DICH_X+38, 465, '物镜'],
    [DICH_X+50, SAMPLE_Y+4, '样品'],
    [966, DET_Y+44, '发射滤光片'], [1100, DET_Y+44, '筒镜'],
    [1245, DET_Y+38, 'sCMOS']
  ];
  labels.forEach(([x,y,t]) => {
    el('text', {x, y, fill:'#64748b', 'font-size':'10.5', 'text-anchor':'middle'}, labelLayer).textContent = t;
  });

  // ─── 区域标注 ───
  el('text', {x:400, y:55, fill:'#3b82f6', 'font-size':'13', 'font-weight':'600', opacity:'0.7', class:'excitation-elem'}, labelLayer).textContent = '◀ 激发臂 (488 nm)';
  el('text', {x:1100, y:85, fill:'#10b981', 'font-size':'13', 'font-weight':'600', opacity:'0.7', class:'detection-elem'}, labelLayer).textContent = '探测臂 (荧光) ▶';
  el('text', {x:DICH_X+70, y:430, fill:'#94a3b8', 'font-size':'11', opacity:'0.5', class:'excitation-elem'}, labelLayer).textContent = '落射照明';

  // ─── 连接标注线（二向色镜说明） ───
  el('text', {x:DICH_X-60, y:EX_Y-35, fill:'#f59e0b', 'font-size':'9.5', opacity:'0.8'}, labelLayer).textContent = '反射488nm ↓';
  el('text', {x:DICH_X-75, y:DET_Y+65, fill:'#10b981', 'font-size':'9.5', opacity:'0.8'}, labelLayer).textContent = '透射荧光 ↑';
}

// ─── 交互逻辑 ───
let currentMode = 'all';

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.controls button').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  applyVisibility();
}

function applyVisibility() {
  // 光束层
  const excBeams = document.querySelectorAll('.excitation-beam, #beamLayer');
  const detBeams = document.querySelectorAll('.detection-beam, #greenBeamLayer');
  const excElems = document.querySelectorAll('.excitation-elem');
  const detElems = document.querySelectorAll('.detection-elem');
  
  excBeams.forEach(e => e.style.opacity = (currentMode === 'detection') ? '0.08' : '1');
  detBeams.forEach(e => e.style.opacity = (currentMode === 'excitation') ? '0.08' : '1');
  excElems.forEach(e => e.style.opacity = (currentMode === 'detection') ? '0.1' : '1');
  detElems.forEach(e => e.style.opacity = (currentMode === 'excitation') ? '0.1' : '1');
  
  // 元件组
  document.querySelectorAll('.component').forEach(g => {
    const id = g.dataset.id;
    const comp = COMPONENTS[id];
    if (!comp) { g.style.opacity = '1'; return; }
    if (currentMode === 'all') g.style.opacity = '1';
    else if (currentMode === 'excitation')
      g.style.opacity = (comp.arm === 'excitation' || comp.arm === 'both') ? '1' : '0.12';
    else
      g.style.opacity = (comp.arm === 'detection' || comp.arm === 'both') ? '1' : '0.12';
  });
}

function showInfo(id) {
  const comp = COMPONENTS[id];
  if (!comp) return;
  infoPanel.classList.add('highlight');
  setTimeout(() => infoPanel.classList.remove('highlight'), 600);
  let html = `<h2>${comp.name}</h2><p>${comp.detail}</p>`;
  if (comp.formula) html += `<div class="formula">${comp.formula}</div>`;
  infoPanel.innerHTML = html;
}

// ─── 事件绑定 ───
document.querySelectorAll('.controls button').forEach(btn => {
  btn.addEventListener('click', () => setMode(btn.dataset.mode));
});

svg.addEventListener('mousemove', e => {
  const comp = e.target.closest('.component');
  if (comp && COMPONENTS[comp.dataset.id]) {
    const c = COMPONENTS[comp.dataset.id];
    tooltip.textContent = c.tip;
    tooltip.classList.add('show');
    tooltip.style.left = (e.clientX + 12) + 'px';
    tooltip.style.top = (e.clientY - 30) + 'px';
    svg.style.cursor = 'pointer';
  } else {
    tooltip.classList.remove('show');
    svg.style.cursor = 'default';
  }
});

svg.addEventListener('mouseleave', () => {
  tooltip.classList.remove('show');
});

svg.addEventListener('click', e => {
  const comp = e.target.closest('.component');
  if (comp && COMPONENTS[comp.dataset.id]) {
    showInfo(comp.dataset.id);
  }
});

// ─── 初始化 ───
buildOpticalPath();
applyVisibility();

})();
</script>
</body>
</html>
